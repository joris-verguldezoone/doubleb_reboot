<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Votre Marque</title>
    <link rel="stylesheet" href="./contact.css">
    <link rel="stylesheet" href="../../shared/css/header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

 <header class="main-header">
        <div class="logo-placeholder"></div>
        <nav class="nav-links">
            <span class="separator">|</span>
            <a href="../story/story.html" class="inactive">STORY</a>
            <a href="../../index.html" class="inactive">HOME</a>
            <a href="../portfolio/portfolio.html" class="inactive">PORTFOLIO</a>
            <span class="separator">|</span>
            <a href="#" class="active">CONTACT</a>
        </nav>
        <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
        </div>
    </header>
    <main class="contact-section">
        <h1 class="main-title">PRENDRE CONTACT</h1>

        <div class="contact-container">
            <section class="contact-info">
                <h2 class="section-subtitle">COORDONNÉES</h2>
                
                <div class="info-item">
                    <i class="fa-regular fa-envelope"></i>
                    <span>contact@votre-marque.com</span>
                </div>
                
                <p class="phone-number">+33 1 23 45 67<br>89</p>

                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                </div>
            </section>
            
            <!-- Colonne Droite -->
            <section class="contact-form">
                <h2 class="section-subtitle">FORMULAIRE DE CONTACT</h2>
                
                <form id="form-contact">
                    <div class="form-group">
                        <label>Nom</label>
                        <input type="text" name="nom">
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Numéro de Commande</label>
                        <input type="text" name="commande">
                    </div>
                    <div class="form-group">
                        <label>Message <span class="required">*</span></label>
                        <textarea name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">ENVOYER MON MESSAGE</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-col">
            <h3>Footer</h3>
            <p>© contact@votre-marque.com.<br>All rights reserved.</p>
        </div>
        <div class="footer-col">
            <h3>Links</h3>
            <ul class="footer-list">
                <li><a href="#">Blog</a></li>
                <li><a href="#">Semarate</a></li>
            </ul>
        </div>
        <div class="footer-col">
            <h3>Links</h3>
            <ul class="footer-list">
                <li><a href="#">Contact</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </footer>

</body>
</html>
